<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduTrack - Student Management System Interactive Demo">
    <title>EduTrack - Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #ecf0f1;
            --white: #ffffff;
            --dark-text: #2c3e50;
            --light-text: #7f8c8d;
            --border: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark-text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: var(--white);
            padding: 40px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            color: #bdc3c7;
            margin-bottom: 5px;
        }

        .status {
            font-size: 0.9rem;
            color: #27ae60;
            margin-top: 10px;
        }

        .status::before {
            content: "● ";
        }

        main {
            padding: 30px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .card h2 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--secondary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        input::placeholder {
            color: var(--light-text);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
            padding: 8px 16px;
            width: auto;
            font-size: 0.9rem;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: var(--white);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .search-wrapper {
            margin-bottom: 20px;
        }

        .search-wrapper input {
            width: 100%;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background: #34495e;
            color: var(--white);
        }

        th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 0.95rem;
        }

        tr:hover {
            background: #f8f9fa;
        }

        tr:last-child td {
            border-bottom: 2px solid var(--border);
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-weight: 600;
            color: var(--primary);
            display: block;
        }

        .student-email {
            font-size: 0.85rem;
            color: var(--light-text);
            display: block;
            margin-top: 4px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: var(--light-text);
            font-size: 1.1rem;
        }

        footer {
            background: #f8f9fa;
            border-top: 1px solid var(--border);
            padding: 20px 30px;
            text-align: center;
            color: var(--light-text);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 10px;
            }

            .btn-danger {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 EduTrack</h1>
            <p>Student Management System</p>
            <p class="status">Interactive Demo</p>
        </header>

        <main>
            <div id="alertBox" class="alert"></div>

            <div class="dashboard">
                <!-- Form Card -->
                <div class="card">
                    <h2>Add New Student</h2>
                    <form id="addStudentForm">
                        <div class="form-group">
                            <label for="studentName">Full Name *</label>
                            <input type="text" id="studentName" name="name" placeholder="Enter student name" required maxlength="80">
                        </div>

                        <div class="form-group">
                            <label for="rollNumber">Roll Number *</label>
                            <input type="number" id="rollNumber" name="roll" placeholder="Enter roll number" required min="1">
                        </div>

                        <div class="form-group">
                            <label for="studentClass">Class/Grade *</label>
                            <input type="text" id="studentClass" name="class" placeholder="e.g., 12 Science" required maxlength="20">
                        </div>

                        <div class="form-group">
                            <label for="studentEmail">Email Address *</label>
                            <input type="email" id="studentEmail" name="email" placeholder="student@example.com" required>
                        </div>

                        <button type="submit" class="btn btn-primary">➕ Add Student</button>
                    </form>
                </div>

                <!-- Records Card -->
                <div class="card">
                    <h2>Student Records</h2>

                    <div class="stats-container">
                        <div class="stat-box">
                            <span class="stat-number" id="totalStudents">0</span>
                            <span class="stat-label">Total Students</span>
                        </div>
                        <div class="stat-box" style="background: linear-gradient(135deg, #27ae60 0%, #229954 100%); box-shadow: 0 4px 15px rgba(39, 174, 96, 0.2);">
                            <span class="stat-number" id="displayedStudents">0</span>
                            <span class="stat-label">Displayed</span>
                        </div>
                    </div>

                    <div class="search-wrapper">
                        <input type="search" id="searchInput" placeholder="🔍 Search by name, roll number, class, or email...">
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Student Name</th>
                                    <th>Roll Number</th>
                                    <th>Class</th>
                                    <th>Email</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTableBody">
                            </tbody>
                        </table>
                    </div>

                    <div id="emptyMessage" class="empty-message" style="display: none;">
                        📚 No students found. Add one to get started!
                    </div>
                </div>
            </div>
        </main>

        <footer>
            Data is stored locally in your browser | <a href="https://github.com/TejashPrakash/student-management-system" target="_blank">View Source Code</a>
        </footer>
    </div>

    <script>
        const STORAGE_KEY = 'edutrack_demo_students';
        
        const INITIAL_DATA = [
            { id: 1, name: 'Aanya Sharma', roll: 101, class: '12 Science', email: 'aanya.sharma@school.edu' },
            { id: 2, name: 'Rohan Mehta', roll: 102, class: '12 Commerce', email: 'rohan.mehta@school.edu' },
            { id: 3, name: 'Priya Desai', roll: 103, class: '12 Science', email: 'priya.desai@school.edu' },
            { id: 4, name: 'Arjun Kumar', roll: 104, class: '12 Arts', email: 'arjun.kumar@school.edu' }
        ];

        let students = [];
        let searchTerm = '';

        // Initialize Application
        function init() {
            loadStudents();
            attachEventListeners();
            renderTable();
            updateStats();
        }

        // Load students from localStorage
        function loadStudents() {
            const stored = localStorage.getItem(STORAGE_KEY);
            students = stored ? JSON.parse(stored) : INITIAL_DATA;
        }

        // Save students to localStorage
        function saveStudents() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        }

        // Attach event listeners
        function attachEventListeners() {
            document.getElementById('addStudentForm').addEventListener('submit', handleAddStudent);
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        }

        // Show alert message
        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3500);
        }

        // Handle form submission
        function handleAddStudent(e) {
            e.preventDefault();
            
            const form = e.target;
            const name = form.name.value.trim();
            const roll = parseInt(form.roll.value);
            const studentClass = form.class.value.trim();
            const email = form.email.value.trim();

            // Validation
            if (!name || !roll || !studentClass || !email) {
                showAlert('❌ Please fill in all fields', 'danger');
                return;
            }

            // Check for duplicate roll number
            if (students.some(s => s.roll === roll)) {
                showAlert('❌ Roll number already exists!', 'danger');
                return;
            }

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('❌ Please enter a valid email address', 'danger');
                return;
            }

            // Add new student
            const newStudent = {
                id: Date.now(),
                name: name,
                roll: roll,
                class: studentClass,
                email: email
            };

            students.push(newStudent);
            saveStudents();
            
            // Reset form
            form.reset();
            renderTable();
            updateStats();
            showAlert(`✅ ${name} added successfully!`, 'success');
        }

        // Handle search
        function handleSearch(e) {
            searchTerm = e.target.value.toLowerCase();
            renderTable();
        }

        // Delete student
        function deleteStudent(id) {
            const student = students.find(s => s.id === id);
            if (confirm(`Are you sure you want to remove ${student.name}?`)) {
                students = students.filter(s => s.id !== id);
                saveStudents();
                renderTable();
                updateStats();
                showAlert(`✅ ${student.name} removed successfully!`, 'success');
            }
        }

        // Filter students based on search term
        function getFilteredStudents() {
            if (!searchTerm) return students;
            
            return students.filter(student => 
                student.name.toLowerCase().includes(searchTerm) ||
                student.roll.toString().includes(searchTerm) ||
                student.class.toLowerCase().includes(searchTerm) ||
                student.email.toLowerCase().includes(searchTerm)
            );
        }

        // Render table
        function renderTable() {
            const tbody = document.getElementById('studentsTableBody');
            const emptyMessage = document.getElementById('emptyMessage');
            const filtered = getFilteredStudents();

            tbody.innerHTML = '';

            if (filtered.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }

            emptyMessage.style.display = 'none';

            filtered.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="student-name">${escapeHtml(student.name)}</div>
                        <div class="student-email">${escapeHtml(student.email)}</div>
                    </td>
                    <td><strong>${student.roll}</strong></td>
                    <td>${escapeHtml(student.class)}</td>
                    <td>${escapeHtml(student.email)}</td>
                    <td>
                        <button class="btn btn-danger" onclick="deleteStudent(${student.id})">🗑️ Remove</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('displayedStudents').textContent = filtered.length;
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalStudents').textContent = students.length;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start the app when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
