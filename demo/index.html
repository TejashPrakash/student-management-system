<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EduTrack Student Management System - Interactive Demo">
  <title>EduTrack - Student Management System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --success-color: #27ae60;
      --danger-color: #e74c3c;
      --light-bg: #ecf0f1;
      --white: #ffffff;
      --text-dark: #2c3e50;
      --text-light: #7f8c8d;
      --border-color: #bdc3c7;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--text-dark);
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--primary-color);
      color: var(--white);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    header p {
      font-size: 1rem;
      color: #bdc3c7;
      font-weight: 300;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--white);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .card h2 {
      color: var(--primary-color);
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      border-bottom: 2px solid var(--secondary-color);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--secondary-color);
      color: var(--white);
      margin-top: 1rem;
    }

    .btn-primary:hover {
      background: #2980b9;
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-danger {
      background: var(--danger-color);
      color: var(--white);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      width: auto;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .search-box {
      margin-bottom: 1.5rem;
    }

    .search-box input {
      width: 100%;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: linear-gradient(135deg, var(--secondary-color) 0%, #2980b9 100%);
      color: var(--white);
      border-radius: 6px;
      font-weight: 600;
    }

    .stats-number {
      font-size: 1.8rem;
      font-weight: 700;
      display: block;
    }

    .stats-label {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th {
      background: #34495e;
      color: var(--white);
      padding: 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 2px solid var(--border-color);
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid #ecf0f1;
      font-size: 0.95rem;
    }

    tr:hover {
      background: #f8f9fa;
    }

    .student-name {
      font-weight: 600;
      color: var(--primary-color);
    }

    .student-email {
      font-size: 0.85rem;
      color: var(--text-light);
      display: block;
      margin-top: 0.25rem;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-light);
    }

    .alert {
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      display: none;
      animation: slideIn 0.3s ease;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      background: var(--primary-color);
      color: var(--text-light);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      margin-top: 2rem;
    }

    footer a {
      color: var(--secondary-color);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      header h1 {
        font-size: 1.8rem;
      }
      main {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>EduTrack</h1>
      <p>Student Management System - Interactive Demo</p>
    </header>

    <main>
      <div class="alert" id="alert"></div>

      <div class="dashboard">
        <div class="card">
          <h2>Add Student</h2>
          <form id="studentForm">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" required maxlength="80" placeholder="e.g., Aanya Sharma">
            </div>
            <div class="form-group">
              <label for="roll">Roll Number</label>
              <input type="number" id="roll" name="roll" required min="1" placeholder="e.g., 101">
            </div>
            <div class="form-group">
              <label for="grade">Class/Grade</label>
              <input type="text" id="grade" name="grade" required maxlength="20" placeholder="e.g., 12 Science">
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required placeholder="e.g., student@example.com">
            </div>
            <button type="submit" class="btn btn-primary">Add Student</button>
          </form>
        </div>

        <div class="card">
          <h2>Student Records</h2>
          
          <div class="stats">
            <div>
              <span class="stats-number" id="totalCount">0</span>
              <span class="stats-label">Total Students</span>
            </div>
          </div>

          <div class="search-box">
            <input type="search" id="searchInput" placeholder="Search by name, roll number, class, or email...">
          </div>

          <table>
            <thead>
              <tr>
                <th>Student Name</th>
                <th>Roll Number</th>
                <th>Class</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="recordsTable"></tbody>
          </table>

          <div class="empty-state" id="emptyState">
            <p>No students found. Add a student to get started!</p>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>EduTrack Demo - Data saved locally in browser only</p>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'edutrack_students';
    
    const DEFAULT_STUDENTS = [
      { id: 1, name: 'Aanya Sharma', roll: '101', grade: '12 Science', email: 'aanya.sharma@school.com' },
      { id: 2, name: 'Rohan Mehta', roll: '102', grade: '12 Commerce', email: 'rohan.mehta@school.com' },
      { id: 3, name: 'Priya Desai', roll: '103', grade: '12 Science', email: 'priya.desai@school.com' }
    ];

    let students = [];

    function init() {
      loadStudents();
      attachEventListeners();
      render();
    }

    function loadStudents() {
      const saved = localStorage.getItem(STORAGE_KEY);
      students = saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
    }

    function saveStudents() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
    }

    function showAlert(message, type = 'success') {
      const alertEl = document.getElementById('alert');
      alertEl.textContent = message;
      alertEl.className = `alert alert-${type} show`;
      setTimeout(() => alertEl.classList.remove('show'), 3000);
    }

    function attachEventListeners() {
      document.getElementById('studentForm').addEventListener('submit', handleAddStudent);
      document.getElementById('searchInput').addEventListener('input', handleSearch);
    }

    function handleAddStudent(e) {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const roll = form.roll.value.trim();
      const grade = form.grade.value.trim();
      const email = form.email.value.trim();

      if (!name || !roll || !grade || !email) {
        showAlert('Please fill in all fields', 'error');
        return;
      }

      if (students.some(s => s.roll === roll)) {
        showAlert('Roll number already exists', 'error');
        return;
      }

      const newStudent = {
        id: Date.now(),
        name: name,
        roll: roll,
        grade: grade,
        email: email
      };

      students.push(newStudent);
      saveStudents();
      form.reset();
      render();
      showAlert(`${name} added successfully!`, 'success');
    }

    function handleSearch(e) {
      render(e.target.value.toLowerCase());
    }

    function deleteStudent(id) {
      const student = students.find(s => s.id === id);
      if (confirm(`Are you sure you want to remove ${student.name}?`)) {
        students = students.filter(s => s.id !== id);
        saveStudents();
        render();
        showAlert(`${student.name} removed successfully!`, 'success');
      }
    }

    function render(searchTerm = '') {
      const tbody = document.getElementById('recordsTable');
      const emptyState = document.getElementById('emptyState');
      const totalCount = document.getElementById('totalCount');

      let filtered = students;
      if (searchTerm) {
        filtered = students.filter(s => 
          s.name.toLowerCase().includes(searchTerm) ||
          s.roll.toLowerCase().includes(searchTerm) ||
          s.grade.toLowerCase().includes(searchTerm) ||
          s.email.toLowerCase().includes(searchTerm)
        );
      }

      totalCount.textContent = students.length;
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      filtered.forEach(student => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>
            <div class="student-name">${escapeHtml(student.name)}</div>
            <span class="student-email">${escapeHtml(student.email)}</span>
          </td>
          <td>${escapeHtml(student.roll)}</td>
          <td>${escapeHtml(student.grade)}</td>
          <td>
            <button class="btn btn-danger" onclick="deleteStudent(${student.id})">Remove</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
